.row{display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
.av{width:18px;height:18px;border-radius:50%;background:var(--xhs);display:inline-block;margin-right:4px}
.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 14px;font-size:11px;color:var(--muted)}

.nav .on{color:var(--xhs);font-weight:700}
.nav b{display:block;font-size:18px;line-height:1.1}
